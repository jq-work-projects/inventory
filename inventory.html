<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventory">
<meta name="theme-color" content="#0a84ff">
<title>Inventory</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --border: #e5e5ea;
    --accent: #0a84ff;
    --accent-pressed: #0066cc;
    --danger: #ff3b30;
    --warn: #ff9500;
    --ok: #34c759;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --radius: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #ffffff;
      --muted: #98989f;
      --border: #38383a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', 'Aptos', 'Segoe UI', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 16px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  nav {
    display: flex; gap: 6px; margin-top: 12px;
    background: var(--bg); padding: 4px; border-radius: 10px;
  }
  nav button {
    flex: 1; padding: 9px 8px; border: 0; border-radius: 8px;
    background: transparent; color: var(--text);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  nav button.active { background: var(--card); box-shadow: var(--shadow); }
  main {
    padding: 16px;
    padding-bottom: calc(var(--safe-bottom) + 24px);
    max-width: 720px; margin: 0 auto;
  }
  .tab { display: none; }
  .tab.active { display: block; }
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 500; }
  input[type="text"], input[type="number"], input[type="search"] {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input[type="file"] { display: none; }
  .img-picker {
    display: flex; align-items: center; gap: 12px; margin-top: 6px;
  }
  .img-preview {
    width: 64px; height: 64px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; overflow: hidden;
  }
  .img-preview img { width: 100%; height: 100%; object-fit: cover; }
  button.primary, button.secondary {
    padding: 12px 16px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer;
    width: 100%; margin-top: 12px;
  }
  button.primary { background: var(--accent); color: white; }
  button.primary:active { background: var(--accent-pressed); }
  button.primary:disabled { background: var(--muted); opacity: 0.5; }
  button.secondary {
    background: var(--bg); color: var(--accent);
    border: 1px solid var(--border);
  }
  .row { display: flex; gap: 12px; align-items: center; }
  .row > * { flex: 1; }
  .item {
    display: flex; gap: 12px; align-items: center;
    padding: 12px; background: var(--card);
    border-radius: var(--radius); margin-bottom: 8px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .item.menu-open { z-index: 10; }
  .item-actions {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .item-actions .badge { margin-left: 0; }
  .item-img {
    width: 52px; height: 52px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--border);
    flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 11px;
  }
  .item-img img { width: 100%; height: 100%; object-fit: cover; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item-stock {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-top: 4px;
  }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.3px; margin-left: 6px; vertical-align: middle;
  }
  .badge.out { background: var(--danger); color: white; }
  .badge.low { background: var(--warn); color: white; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 0; background: var(--bg); color: var(--text);
    font-size: 16px; cursor: pointer;
  }
  .empty {
    text-align: center; color: var(--muted);
    padding: 40px 16px; font-size: 14px;
  }
  .qty {
    display: flex; align-items: center; gap: 6px;
  }
  .qty button {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 18px; font-weight: 600; cursor: pointer;
  }
  .qty input {
    width: 38px; text-align: center; padding: 6px 2px;
    font-size: 15px; font-weight: 600;
  }
  .item-qty-row {
    flex-basis: 100%;
    justify-content: flex-end;
    margin-top: 8px;
    display: none;
  }
  @media (max-width: 767px) {
    #tab-sale .item { flex-wrap: wrap; }
    .item-qty-row { display: flex; }
    #tab-sale .item-actions .qty { display: none; }
  }
  .total-bar {
    position: sticky; bottom: var(--safe-bottom); z-index: 5;
    background: var(--card); padding: 16px;
    border-radius: var(--radius); box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    margin-top: 16px;
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 18px; font-weight: 700;
  }
  .total-row .label { font-size: 14px; color: var(--muted); font-weight: 500; }
  .sale-line {
    display: flex; justify-content: space-between;
    padding: 6px 0; font-size: 14px;
  }
  .sale-line .name { color: var(--text); }
  .sale-line .sub { color: var(--muted); font-size: 12px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 600px;
    border-radius: 16px 16px 0 0;
    padding: 0 20px;
    padding-bottom: calc(var(--safe-bottom) + 20px);
    max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }
  .toast {
    position: fixed; top: calc(var(--safe-top) + 12px);
    left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: white;
    padding: 10px 16px; border-radius: 10px;
    font-size: 14px; z-index: 200;
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .search-box { margin-bottom: 12px; }
  .inv-toolbar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
  }
  .inv-toolbar input[type="search"] { flex: 1; }
  .inv-toolbar button {
    width: auto; margin: 0; padding: 12px 14px;
    font-size: 14px; white-space: nowrap; flex-shrink: 0;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    position: sticky;
    top: 0;
    background: var(--card);
    z-index: 2;
    padding: 20px 0 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; }
  body.modal-open { overflow: hidden; }
  select {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
    font-family: inherit;
  }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: white;
    margin: 0 4px 4px 0;
    border: 1px solid transparent;
    font-family: inherit;
    line-height: 1.3;
  }
  button.tag-chip { cursor: pointer; }
  .tag-chip.outline {
    background: transparent !important;
    border-color: currentColor;
  }
  .tag-chip .x {
    margin-left: 2px; padding: 0 4px;
    opacity: 0.85; cursor: pointer; font-size: 14px;
  }
  .color-swatch-row {
    display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 12px;
  }
  .color-swatch {
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; border: 0; padding: 0;
  }
  .color-swatch.selected {
    box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text);
  }
  .tag-type-header {
    font-size: 11px; color: var(--muted);
    font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin: 12px 0 6px;
  }
  .item-tags { margin-top: 6px; }
  .item .tag-chip {
    font-size: 11px;
    padding: 2px 8px;
    margin: 0 3px 3px 0;
  }
  #item-tag-picker { margin-bottom: 4px; }
  .inv-toolbar .filter-btn,
  .inv-toolbar .sort-btn {
    padding: 10px; margin: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    position: relative; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .inv-toolbar .filter-btn.active,
  .inv-toolbar .sort-btn.active {
    color: var(--accent); border-color: var(--accent);
  }
  .inv-toolbar .filter-btn .dot {
    position: absolute; top: 4px; right: 4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    display: none;
    border: 2px solid var(--card);
    box-sizing: content-box;
  }
  .inv-toolbar .filter-btn.has-filters .dot { display: block; }
  .inv-toolbar .filter-btn svg,
  .inv-toolbar .sort-btn svg { display: block; }
  .filter-chips-strip {
    display: none;
    flex-wrap: wrap;
    padding-top: 12px;
    margin-top: 8px;
    margin-bottom: 4px;
    border-top: 1px solid var(--border);
  }
  .filter-chips-strip.active { display: flex; }
  .sort-status {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-top: 6px;
    margin-bottom: 6px;
  }
  .sort-option {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    margin-top: 0;
    font-family: inherit;
  }
  .sort-option:active { background: var(--bg); }
  .sort-option.active {
    background: var(--bg);
    color: var(--accent);
    font-weight: 600;
  }
  .kebab-btn {
    width: 32px; height: 32px;
    border-radius: 8px; padding: 0;
    background: transparent; border: 0; cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
  }
  .kebab-btn:active { background: var(--bg); }
  .kebab-btn span {
    display: block;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text);
  }
  .row-menu {
    position: absolute;
    top: 0;
    left: calc(100% + 6px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    min-width: 120px;
    padding: 4px;
    display: none;
    z-index: 30;
  }
  .row-menu.open { display: block; }
  .row-menu-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px;
    background: transparent; border: 0; border-radius: 6px;
    font-size: 14px; color: var(--text);
    cursor: pointer; text-align: left;
    font-family: inherit;
  }
  .row-menu-item:active { background: var(--bg); }
  .row-menu-item.danger { color: var(--danger); }
  .row-menu-icon { flex-shrink: 0; display: block; }
  .last-modified {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .last-modified.show { display: block; }
  .cart-line-remove {
    background: none; border: 0;
    color: var(--danger);
    font-size: 13px; font-weight: 500;
    padding: 4px 0; cursor: pointer;
    font-family: inherit;
  }
  .cart-line-remove:active { opacity: 0.6; }
  .form-section-label {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .form-actions button.primary,
  .form-actions button.secondary {
    flex: 1;
    margin-top: 0;
  }
  .history-header {
    position: sticky;
    top: calc(var(--safe-top) + 108px);
    background: var(--card);
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0 10px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .small-link {
    background: none; border: 0; color: var(--accent);
    font-size: 13px; cursor: pointer; padding: 4px 0;
  }
  hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  #sale-cart-card.cart-empty hr,
  #sale-cart-card.cart-empty .total-row,
  #sale-cart-card.cart-empty #confirm-sale,
  #sale-cart-card.cart-empty #clear-sale { display: none; }
  @media (max-width: 767px) {
    #sale-cart-card.cart-empty { display: none; }
    #tab-sale.active {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--safe-top) - var(--safe-bottom) - 150px);
      gap: 8px;
    }
    #tab-sale > .card {
      margin-bottom: 0;
      overflow-y: auto;
      min-height: 0;
      flex: 1 1 40%;
    }
    #tab-sale > .card:first-child {
      flex: 1 1 60%;
    }
  }
  @media (min-width: 768px) {
    main { max-width: 1100px; }
    #tab-inventory, #tab-history {
      max-width: 720px;
      margin: 0 auto;
    }
    #tab-sale.active {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    #tab-sale > .card {
      flex: 1;
      margin-bottom: 0;
      min-width: 0;
    }
    #tab-sale > #sale-cart-card {
      flex: 0 0 340px;
      position: sticky;
      top: calc(var(--safe-top) + 120px);
      max-height: calc(100vh - var(--safe-top) - 140px);
      overflow-y: auto;
    }
    .modal-overlay { align-items: center; }
    .modal { border-radius: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">Inventory</h1>
  <nav>
    <button class="tab-btn active" data-tab="inventory">Stock</button>
    <button class="tab-btn" data-tab="sale">New Sale</button>
    <button class="tab-btn" data-tab="history">History</button>
  </nav>
</header>

<main>
  <!-- INVENTORY TAB -->
  <section id="tab-inventory" class="tab active">
    <div class="card">
      <div class="inv-toolbar">
        <input type="search" id="inv-search" placeholder="Search items or tags...">
        <button type="button" class="filter-btn" id="open-filter" aria-label="Filter">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </g>
            <g fill="currentColor" stroke="none">
              <circle cx="8" cy="6" r="2.5"/>
              <circle cx="16" cy="12" r="2.5"/>
              <circle cx="8" cy="18" r="2.5"/>
            </g>
          </svg>
          <span class="dot"></span>
        </button>
        <button type="button" class="sort-btn" id="open-sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/>
              <path d="M6 12h12"/>
              <path d="M9 18h6"/>
            </g>
          </svg>
        </button>
        <button type="button" class="secondary" id="open-manage-tags">Tags</button>
        <button type="button" class="primary" id="open-add-item">+ Add item</button>
      </div>
      <div id="filter-chips-strip" class="filter-chips-strip"></div>
      <div id="sort-status" class="sort-status"></div>
      <div id="inv-list"></div>
    </div>
  </section>

  <!-- SALE TAB -->
  <section id="tab-sale" class="tab">
    <div class="card">
      <div class="inv-toolbar">
        <input type="search" id="sale-search" placeholder="Search items or tags...">
        <button type="button" class="filter-btn" id="open-sale-filter" aria-label="Filter">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </g>
            <g fill="currentColor" stroke="none">
              <circle cx="8" cy="6" r="2.5"/>
              <circle cx="16" cy="12" r="2.5"/>
              <circle cx="8" cy="18" r="2.5"/>
            </g>
          </svg>
          <span class="dot"></span>
        </button>
        <button type="button" class="sort-btn" id="open-sale-sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/>
              <path d="M6 12h12"/>
              <path d="M9 18h6"/>
            </g>
          </svg>
        </button>
      </div>
      <div id="sale-filter-chips-strip" class="filter-chips-strip"></div>
      <div id="sale-sort-status" class="sort-status"></div>
      <div id="sale-picker"></div>
    </div>
    <div class="card" id="sale-cart-card">
      <h2 style="margin:0 0 8px;font-size:16px;">Order</h2>
      <div id="sale-cart"></div>
      <hr>
      <div class="total-row">
        <span class="label">Total</span>
        <span id="sale-total">0.00</span>
      </div>
      <button class="primary" id="confirm-sale">Confirm sale</button>
      <button class="secondary" id="clear-sale">Clear order</button>
    </div>
  </section>

  <!-- HISTORY TAB -->
  <section id="tab-history" class="tab">
    <div class="card">
      <div class="history-header">
        <h2 style="margin:0;font-size:16px;">Sales History</h2>
        <button class="small-link" id="export-btn">Export CSV</button>
      </div>
      <div id="history-list"></div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="item-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Add Item</h2>
      <button type="button" class="icon-btn" id="close-item-modal" aria-label="Close">✕</button>
    </div>
    <form id="item-form">
      <input type="hidden" id="item-id">
      <label for="i-name">Item name</label>
      <input type="text" id="i-name" required autocomplete="off">
      <label for="i-code">Item code</label>
      <input type="text" id="i-code" autocomplete="off">
      <div class="row">
        <div>
          <label for="i-price">Price</label>
          <input type="number" id="i-price" step="0.01" min="0" inputmode="decimal" required>
        </div>
        <div>
          <label for="i-stock">Stock</label>
          <input type="number" id="i-stock" min="0" step="1" inputmode="numeric" required>
        </div>
      </div>
      <label for="i-low">Low-stock threshold</label>
      <input type="number" id="i-low" min="0" step="1" inputmode="numeric" value="5">
      <label class="form-section-label">Tags</label>
      <div id="item-tag-picker"></div>
      <button type="button" class="small-link" id="open-tags-from-item">Manage tags →</button>
      <label class="form-section-label">Image (optional)</label>
      <div class="img-picker">
        <div class="img-preview" id="i-img-preview">No image</div>
        <button type="button" class="secondary" style="flex:1;margin:0;color:var(--text);" onclick="document.getElementById('i-img').click()">Choose photo</button>
        <button type="button" class="small-link" id="i-img-clear" style="display:none;">Remove</button>
      </div>
      <input type="file" id="i-img" accept="image/*">
      <div class="form-actions">
        <button type="button" class="secondary" id="i-cancel">Cancel</button>
        <button type="submit" class="primary" id="i-submit">Add item</button>
      </div>
      <div id="item-last-modified" class="last-modified"></div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="tags-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>Manage Tags</h2>
      <button type="button" class="icon-btn" id="close-tags-modal" aria-label="Close">✕</button>
    </div>
    <form id="tag-form">
      <label for="t-type">Tag type</label>
      <select id="t-type">
        <option value="series">Series</option>
        <option value="itemType">Item Type</option>
      </select>
      <label for="t-name">Tag name</label>
      <input type="text" id="t-name" required autocomplete="off" placeholder="e.g. Spring 2026">
      <label>Color</label>
      <div class="color-swatch-row" id="color-swatches"></div>
      <button type="submit" class="primary">Add tag</button>
    </form>
    <hr>
    <div id="tags-list-area"></div>
  </div>
</div>

<div class="modal-overlay" id="filter-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>Filter by tag</h2>
      <button type="button" class="icon-btn" id="close-filter-modal" aria-label="Close">✕</button>
    </div>
    <div id="filter-modal-body"></div>
  </div>
</div>

<div class="modal-overlay" id="sort-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>Sort by</h2>
      <button type="button" class="icon-btn" id="close-sort-modal" aria-label="Close">✕</button>
    </div>
    <div id="sort-modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'inv_v1';
  const state = load();

  function load() {
    let s = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) s = JSON.parse(raw);
    } catch (e) {}
    s = s || {};
    if (!Array.isArray(s.items)) s.items = [];
    if (!Array.isArray(s.sales)) s.sales = [];
    if (!s.cart || typeof s.cart !== 'object') s.cart = {};
    if (!Array.isArray(s.tags)) s.tags = [];
    let dirty = false;
    const now = Date.now();
    s.items.forEach(item => {
      if (!item.updatedAt) { item.updatedAt = now; dirty = true; }
    });
    if (dirty) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
    }
    return s;
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      toast('Storage full — try removing images or old sales');
    }
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function fmt(n) {
    return Number(n).toFixed(2);
  }
  function toast(msg, ms) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(() => t.classList.remove('show'), ms || 2000);
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'sale') renderSalePicker();
      if (btn.dataset.tab === 'history') renderHistory();
      if (btn.dataset.tab === 'inventory') renderInventory();
      window.scrollTo(0, 0);
    });
  });

  // ---------- Image handling ----------
  const MAX_DIM = 600;
  const JPEG_Q = 0.75;
  let pendingImage = null;

  document.getElementById('i-img').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingImage = await compressImage(file);
      const prev = document.getElementById('i-img-preview');
      prev.innerHTML = '<img src="' + pendingImage + '">';
      document.getElementById('i-img-clear').style.display = '';
    } catch (err) {
      toast('Could not load image');
    }
    e.target.value = '';
  });

  document.getElementById('i-img-clear').addEventListener('click', () => {
    pendingImage = null;
    document.getElementById('i-img-preview').textContent = 'No image';
    document.getElementById('i-img-clear').style.display = 'none';
  });

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > MAX_DIM) {
            height = Math.round(height * MAX_DIM / width); width = MAX_DIM;
          } else if (height > MAX_DIM) {
            width = Math.round(width * MAX_DIM / height); height = MAX_DIM;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', JPEG_Q));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Inventory: add / edit ----------
  const form = document.getElementById('item-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('item-id').value;
    const data = {
      name: document.getElementById('i-name').value.trim(),
      code: document.getElementById('i-code').value.trim(),
      price: parseFloat(document.getElementById('i-price').value) || 0,
      stock: parseInt(document.getElementById('i-stock').value, 10) || 0,
      lowAt: parseInt(document.getElementById('i-low').value, 10) || 0,
      image: pendingImage,
      tagIds: Array.from(pendingTagIds),
      updatedAt: Date.now(),
    };
    if (!data.name) return;
    if (id) {
      const item = state.items.find(i => i.id === id);
      if (item) Object.assign(item, data);
      toast('Item updated');
    } else {
      state.items.push(Object.assign({ id: uid() }, data));
      toast('Item added');
    }
    save();
    closeItemModal();
    resetForm();
    renderInventory();
  });

  document.getElementById('i-cancel').addEventListener('click', () => {
    closeItemModal();
    resetForm();
  });
  document.getElementById('close-item-modal').addEventListener('click', () => {
    closeItemModal();
    resetForm();
  });
  document.getElementById('item-modal').addEventListener('click', (e) => {
    if (e.target.id === 'item-modal') {
      closeItemModal();
      resetForm();
    }
  });
  document.getElementById('open-add-item').addEventListener('click', () => {
    resetForm();
    openItemModal();
  });

  function openItemModal() {
    document.getElementById('item-modal').classList.add('active');
    document.body.classList.add('modal-open');
    setTimeout(() => document.getElementById('i-name').focus(), 50);
  }
  function closeItemModal() {
    document.getElementById('item-modal').classList.remove('active');
    document.body.classList.remove('modal-open');
  }

  function resetForm() {
    form.reset();
    document.getElementById('item-id').value = '';
    document.getElementById('i-low').value = '5';
    pendingImage = null;
    document.getElementById('i-img-preview').textContent = 'No image';
    document.getElementById('i-img-clear').style.display = 'none';
    document.getElementById('i-submit').textContent = 'Add item';
    document.getElementById('modal-title').textContent = 'Add Item';
    document.getElementById('item-last-modified').classList.remove('show');
    pendingTagIds.clear();
    renderTagPicker();
  }

  function loadIntoForm(item) {
    document.getElementById('item-id').value = item.id;
    document.getElementById('i-name').value = item.name;
    document.getElementById('i-code').value = item.code || '';
    document.getElementById('i-price').value = item.price;
    document.getElementById('i-stock').value = item.stock;
    document.getElementById('i-low').value = item.lowAt || 0;
    pendingImage = item.image || null;
    const prev = document.getElementById('i-img-preview');
    if (pendingImage) {
      prev.innerHTML = '<img src="' + pendingImage + '">';
      document.getElementById('i-img-clear').style.display = '';
    } else {
      prev.textContent = 'No image';
      document.getElementById('i-img-clear').style.display = 'none';
    }
    pendingTagIds.clear();
    (item.tagIds || []).forEach(id => pendingTagIds.add(id));
    renderTagPicker();
    document.getElementById('i-submit').textContent = 'Save changes';
    document.getElementById('modal-title').textContent = 'Edit Item';
    const lm = document.getElementById('item-last-modified');
    if (item.updatedAt) {
      const dateStr = new Date(item.updatedAt).toLocaleString(undefined, {
        dateStyle: 'medium', timeStyle: 'short'
      });
      lm.textContent = 'Last modified: ' + dateStr;
      lm.classList.add('show');
    } else {
      lm.classList.remove('show');
    }
    openItemModal();
  }

  // ---------- Inventory list ----------
  document.getElementById('inv-search').addEventListener('input', renderInventory);

  function stockBadge(item) {
    if (item.stock <= 0) return '<span class="badge out">Out of stock</span>';
    if (item.stock <= (item.lowAt || 0)) return '<span class="badge low">Low</span>';
    return '';
  }

  function matchesQuery(item, q) {
    if (!q) return true;
    q = q.toLowerCase();
    if ((item.name || '').toLowerCase().includes(q)) return true;
    if ((item.code || '').toLowerCase().includes(q)) return true;
    const tagNames = (item.tagIds || [])
      .map(id => state.tags.find(t => t.id === id))
      .filter(Boolean)
      .map(t => t.name.toLowerCase());
    return tagNames.some(n => n.includes(q));
  }

  function matchesFilter(item, filterSet) {
    if (!filterSet.size) return true;
    const byType = {};
    filterSet.forEach(tid => {
      const tag = state.tags.find(t => t.id === tid);
      if (!tag) return;
      (byType[tag.type] = byType[tag.type] || []).push(tid);
    });
    const itemTags = item.tagIds || [];
    return Object.values(byType).every(idsInType =>
      idsInType.some(id => itemTags.includes(id))
    );
  }

  function renderInventory() {
    const q = document.getElementById('inv-search').value.trim();
    const list = document.getElementById('inv-list');
    const stockSortOptHdr = SORT_OPTIONS.find(o => o.key === stockSort);
    document.getElementById('sort-status').textContent = stockSortOptHdr ? 'Sorted by: ' + stockSortOptHdr.label : '';
    const filtered = state.items.filter(i => matchesQuery(i, q) && matchesFilter(i, activeFilterIds));
    if (!filtered.length) {
      const hasNarrowing = q || activeFilterIds.size;
      list.innerHTML = '<div class="empty">' +
        (state.items.length
          ? (hasNarrowing ? 'No items match your search or filters.' : 'No items.')
          : 'No items yet. Tap "+ Add item" to get started.') +
        '</div>';
      return;
    }
    const sortedItems = sortItems(filtered, stockSort);
    list.innerHTML = sortedItems.map(item => `
      <div class="item">
        <div class="item-img">${item.image ? `<img src="${item.image}">` : 'No img'}</div>
        <div class="item-info">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-meta">
            ${item.code ? escapeHtml(item.code) + ' · ' : ''}$${fmt(item.price)}
          </div>
          <div class="item-stock">Stock: ${item.stock}</div>
          ${renderItemTags(item)}
        </div>
        <div class="item-actions">
          ${stockBadge(item)}
          <button class="kebab-btn" data-menu-toggle="${item.id}" aria-label="More actions">
            <span></span><span></span><span></span>
          </button>
          <div class="row-menu" id="menu-${item.id}">
            <button type="button" class="row-menu-item" data-edit="${item.id}">
              <svg class="row-menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              <span>Edit</span>
            </button>
            <button type="button" class="row-menu-item danger" data-del="${item.id}">
              <svg class="row-menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span>Delete</span>
            </button>
          </div>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('[data-menu-toggle]').forEach(b => {
      b.addEventListener('click', () => toggleRowMenu(b.dataset.menuToggle));
    });
    list.querySelectorAll('[data-edit]').forEach(b => {
      b.addEventListener('click', () => {
        const item = state.items.find(i => i.id === b.dataset.edit);
        closeAllRowMenus();
        if (item) loadIntoForm(item);
      });
    });
    list.querySelectorAll('[data-del]').forEach(b => {
      b.addEventListener('click', () => {
        const item = state.items.find(i => i.id === b.dataset.del);
        closeAllRowMenus();
        if (!item) return;
        if (confirm(`Delete "${item.name}"? This cannot be undone.`)) {
          state.items = state.items.filter(i => i.id !== item.id);
          delete state.cart[item.id];
          save();
          renderInventory();
        }
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ---------- Sale ----------
  document.getElementById('sale-search').addEventListener('input', renderSalePicker);

  function renderSalePicker() {
    const q = document.getElementById('sale-search').value.trim();
    const picker = document.getElementById('sale-picker');
    const saleSortOptHdr = SORT_OPTIONS.find(o => o.key === saleSort);
    document.getElementById('sale-sort-status').textContent = saleSortOptHdr ? 'Sorted by: ' + saleSortOptHdr.label : '';
    const available = state.items.filter(i => matchesQuery(i, q) && matchesFilter(i, saleFilterIds));
    if (!state.items.length) {
      picker.innerHTML = '<div class="empty">Add items in the Stock tab first.</div>';
      renderCart();
      return;
    }
    if (!available.length) {
      const hasNarrowing = q || saleFilterIds.size;
      picker.innerHTML = '<div class="empty">' +
        (hasNarrowing ? 'No items match your search or filters.' : 'No items.') +
        '</div>';
      renderCart();
      return;
    }
    const sortedAvailable = sortItems(available, saleSort);
    picker.innerHTML = sortedAvailable.map(item => {
      const inCart = state.cart[item.id] || 0;
      const remaining = item.stock - inCart;
      const isOut = item.stock <= 0;
      const canAdd = remaining > 0;
      const qtyWidgetHtml = `<div class="qty">
             <button type="button" data-cart-dec="${item.id}">−</button>
             <input type="number" min="0" max="${item.stock}" value="${inCart}" data-cart-set="${item.id}" inputmode="numeric">
             <button type="button" data-cart-inc="${item.id}" ${canAdd ? '' : 'disabled'} style="${canAdd ? '' : 'opacity:0.4;'}">+</button>
           </div>`;
      const topActionHtml = inCart > 0
        ? qtyWidgetHtml
        : `<button class="icon-btn" data-add="${item.id}" ${canAdd ? '' : 'disabled'} style="${canAdd ? '' : 'opacity:0.4;'}">+</button>`;
      const qtyRowHtml = inCart > 0
        ? `<div class="item-qty-row">${qtyWidgetHtml}</div>`
        : '';
      return `
        <div class="item">
          <div class="item-img">${item.image ? `<img src="${item.image}">` : 'No img'}</div>
          <div class="item-info">
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="item-meta">
              $${fmt(item.price)} · ${isOut ? 'Out of stock' : remaining + ' available'}
            </div>
            ${renderItemTags(item)}
          </div>
          <div class="item-actions">
            ${stockBadge(item)}
            ${topActionHtml}
          </div>
          ${qtyRowHtml}
        </div>
      `;
    }).join('');
    picker.querySelectorAll('[data-add]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.dataset.add;
        const item = state.items.find(i => i.id === id);
        if (!item) return;
        const current = state.cart[id] || 0;
        if (current >= item.stock) {
          toast('No more stock for ' + item.name);
          return;
        }
        state.cart[id] = current + 1;
        save();
        renderSalePicker();
      });
    });
    picker.querySelectorAll('[data-cart-inc]').forEach(b => {
      b.addEventListener('click', () => changeCart(b.dataset.cartInc, +1));
    });
    picker.querySelectorAll('[data-cart-dec]').forEach(b => {
      b.addEventListener('click', () => changeCart(b.dataset.cartDec, -1));
    });
    picker.querySelectorAll('[data-cart-set]').forEach(inp => {
      inp.addEventListener('change', () => {
        const id = inp.dataset.cartSet;
        const item = state.items.find(i => i.id === id);
        if (!item) return;
        let v = parseInt(inp.value, 10) || 0;
        if (v < 0) v = 0;
        if (v > item.stock) { v = item.stock; toast('Capped at available stock'); }
        if (v === 0) delete state.cart[id]; else state.cart[id] = v;
        save();
        renderSalePicker();
      });
    });
    renderCart();
  }

  function renderCart() {
    const cartCard = document.getElementById('sale-cart-card');
    const cartEl = document.getElementById('sale-cart');
    const totalEl = document.getElementById('sale-total');
    const entries = Object.entries(state.cart).filter(([, qty]) => qty > 0);
    cartCard.classList.toggle('cart-empty', !entries.length);
    if (!entries.length) {
      cartEl.innerHTML = '<div style="color:var(--muted);font-size:14px;text-align:center;padding:16px 0;">No items in order yet.</div>';
      totalEl.textContent = '$0.00';
      return;
    }
    let total = 0;
    cartEl.innerHTML = entries.map(([id, qty]) => {
      const item = state.items.find(i => i.id === id);
      if (!item) return '';
      const lineTotal = item.price * qty;
      total += lineTotal;
      return `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);">
          <div class="sale-line">
            <span class="name">${escapeHtml(item.name)} × ${qty}</span>
            <span>$${fmt(lineTotal)}</span>
          </div>
          <div class="sale-line">
            <span class="sub">$${fmt(item.price)} each</span>
            <button type="button" class="cart-line-remove" data-cart-remove="${id}">Remove</button>
          </div>
        </div>
      `;
    }).join('');
    totalEl.textContent = '$' + fmt(total);

    cartEl.querySelectorAll('[data-cart-remove]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.dataset.cartRemove;
        delete state.cart[id];
        save();
        renderSalePicker();
      });
    });
  }

  function changeCart(id, delta) {
    const item = state.items.find(i => i.id === id);
    if (!item) return;
    const next = (state.cart[id] || 0) + delta;
    if (next <= 0) delete state.cart[id];
    else if (next > item.stock) { toast('No more stock for ' + item.name); return; }
    else state.cart[id] = next;
    save();
    renderSalePicker();
  }

  document.getElementById('clear-sale').addEventListener('click', () => {
    if (!Object.keys(state.cart).length) return;
    if (confirm('Clear the current order?')) {
      state.cart = {};
      save();
      renderSalePicker();
    }
  });

  document.getElementById('confirm-sale').addEventListener('click', () => {
    const entries = Object.entries(state.cart).filter(([, q]) => q > 0);
    if (!entries.length) return;
    const lines = [];
    let total = 0;
    let lowAfter = [];
    let outAfter = [];
    for (const [id, qty] of entries) {
      const item = state.items.find(i => i.id === id);
      if (!item) continue;
      if (qty > item.stock) {
        toast('Not enough stock for ' + item.name);
        return;
      }
      lines.push({
        itemId: id, name: item.name, code: item.code || '',
        qty, unitPrice: item.price, lineTotal: item.price * qty
      });
      total += item.price * qty;
    }
    if (!confirm('Confirm sale of ' + lines.length + ' item(s) for $' + fmt(total) + '?')) return;
    for (const line of lines) {
      const item = state.items.find(i => i.id === line.itemId);
      item.stock -= line.qty;
      if (item.stock <= 0) outAfter.push(item.name);
      else if (item.stock <= (item.lowAt || 0)) lowAfter.push(item.name);
    }
    state.sales.push({
      id: uid(),
      ts: Date.now(),
      lines,
      total
    });
    state.cart = {};
    save();
    let msg = 'Sale recorded — $' + fmt(total);
    if (outAfter.length) msg += ' · Out: ' + outAfter.join(', ');
    else if (lowAfter.length) msg += ' · Low: ' + lowAfter.join(', ');
    toast(msg, 3500);
    renderSalePicker();
  });

  // ---------- History ----------
  function renderHistory() {
    const list = document.getElementById('history-list');
    if (!state.sales.length) {
      list.innerHTML = '<div class="empty">No sales yet.</div>';
      return;
    }
    const sorted = state.sales.slice().sort((a, b) => b.ts - a.ts);
    list.innerHTML = sorted.map(sale => {
      const d = new Date(sale.ts);
      const date = d.toLocaleString();
      const lines = sale.lines.map(l =>
        `<div class="sale-line"><span class="sub">${escapeHtml(l.name)} × ${l.qty}</span><span class="sub">$${fmt(l.lineTotal)}</span></div>`
      ).join('');
      return `
        <div style="padding:12px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>${date}</strong>
            <strong>$${fmt(sale.total)}</strong>
          </div>
          <div style="margin-top:6px;">${lines}</div>
          <button class="small-link" data-undo="${sale.id}">Undo (restock)</button>
        </div>
      `;
    }).join('');
    list.querySelectorAll('[data-undo]').forEach(b => {
      b.addEventListener('click', () => {
        const sale = state.sales.find(s => s.id === b.dataset.undo);
        if (!sale) return;
        if (!confirm('Undo this sale and restock the items?')) return;
        for (const line of sale.lines) {
          const item = state.items.find(i => i.id === line.itemId);
          if (item) item.stock += line.qty;
        }
        state.sales = state.sales.filter(s => s.id !== sale.id);
        save();
        renderHistory();
        toast('Sale undone, stock restored');
      });
    });
  }

  document.getElementById('export-btn').addEventListener('click', () => {
    if (!state.sales.length) { toast('No sales to export'); return; }
    const rows = [['Date', 'Item', 'Code', 'Qty', 'Unit Price', 'Line Total', 'Sale Total']];
    state.sales.slice().sort((a, b) => a.ts - b.ts).forEach(s => {
      const date = new Date(s.ts).toISOString();
      s.lines.forEach((l, idx) => {
        rows.push([
          date, l.name, l.code, l.qty,
          fmt(l.unitPrice), fmt(l.lineTotal),
          idx === 0 ? fmt(s.total) : ''
        ]);
      });
    });
    const csv = rows.map(r => r.map(c => {
      const s = String(c == null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sales-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // ---------- Tags ----------
  const TAG_COLORS = [
    '#d6249f', // Fuchsia / Magenta
    '#2563eb', // Royal Blue
    '#1e3a8a', // Navy
    '#6b7280', // Grey
    '#dc2626', // Crimson
    '#15803d', // Forest Green
    '#d97706', // Amber
    '#0d9488', // Teal
    '#7c3aed', // Purple
    '#475569', // Slate
  ];
  const TAG_TYPE_LABELS = { series: 'Series', itemType: 'Item Type' };
  const pendingTagIds = new Set();
  const activeFilterIds = new Set();
  const saleFilterIds = new Set();
  let currentFilterContext = null;
  let selectedTagColor = TAG_COLORS[0];

  function renderFilterModalBody() {
    if (!currentFilterContext) return;
    const { filterSet, refresh } = currentFilterContext;
    const bodyEl = document.getElementById('filter-modal-body');

    if (!state.tags.length) {
      bodyEl.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:4px 0;">No tags yet. Create some via the Tags button to filter.</div>';
      return;
    }

    const groups = { series: [], itemType: [] };
    state.tags.forEach(t => { if (groups[t.type]) groups[t.type].push(t); });

    let html = '';
    if (filterSet.size) {
      html += '<div style="margin-bottom:10px;"><button type="button" class="small-link" data-clear-filters>Clear all (' + filterSet.size + ')</button></div>';
    }

    ['series', 'itemType'].forEach(type => {
      if (!groups[type].length) return;
      html += `<div class="tag-type-header">${TAG_TYPE_LABELS[type]}</div><div style="margin-bottom:6px;">`;
      groups[type].forEach(t => {
        const selected = filterSet.has(t.id);
        const style = selected
          ? `background:${t.color};color:white;`
          : `color:${t.color};border-color:${t.color};`;
        html += `<button type="button" class="tag-chip ${selected ? '' : 'outline'}" data-toggle-filter="${t.id}" style="${style}">${escapeHtml(t.name)}</button>`;
      });
      html += '</div>';
    });

    bodyEl.innerHTML = html;

    bodyEl.querySelectorAll('[data-toggle-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.toggleFilter;
        if (filterSet.has(id)) filterSet.delete(id);
        else filterSet.add(id);
        refresh();
        renderFilterModalBody();
      });
    });

    const clear = bodyEl.querySelector('[data-clear-filters]');
    if (clear) {
      clear.addEventListener('click', () => {
        filterSet.clear();
        refresh();
        renderFilterModalBody();
      });
    }
  }

  function openFilterModal(filterSet, refresh) {
    currentFilterContext = { filterSet, refresh };
    document.getElementById('filter-modal').classList.add('active');
    document.body.classList.add('modal-open');
    renderFilterModalBody();
  }

  function closeFilterModal() {
    document.getElementById('filter-modal').classList.remove('active');
    currentFilterContext = null;
    const itemModalOpen = document.getElementById('item-modal').classList.contains('active');
    const tagsModalOpen = document.getElementById('tags-modal').classList.contains('active');
    if (!itemModalOpen && !tagsModalOpen) {
      document.body.classList.remove('modal-open');
    }
  }

  function renderFilterChips(stripEl, btnEl, filterSet, onRemove) {
    btnEl.classList.toggle('has-filters', filterSet.size > 0);
    if (!filterSet.size) {
      stripEl.classList.remove('active');
      stripEl.innerHTML = '';
      return;
    }
    stripEl.classList.add('active');
    let html = '';
    filterSet.forEach(tid => {
      const tag = state.tags.find(t => t.id === tid);
      if (!tag) return;
      html += `<button type="button" class="tag-chip" style="background:${tag.color};color:white;" data-remove-filter="${tid}">${escapeHtml(tag.name)}<span class="x">×</span></button>`;
    });
    stripEl.innerHTML = html;
    stripEl.querySelectorAll('[data-remove-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        filterSet.delete(chip.dataset.removeFilter);
        onRemove();
      });
    });
  }

  function renderFilterChipsStock() {
    renderFilterChips(
      document.getElementById('filter-chips-strip'),
      document.getElementById('open-filter'),
      activeFilterIds,
      refreshStockFilter
    );
  }

  function renderFilterChipsSale() {
    renderFilterChips(
      document.getElementById('sale-filter-chips-strip'),
      document.getElementById('open-sale-filter'),
      saleFilterIds,
      refreshSaleFilter
    );
  }

  function refreshStockFilter() {
    renderFilterChipsStock();
    renderInventory();
  }

  function refreshSaleFilter() {
    renderFilterChipsSale();
    renderSalePicker();
  }

  document.getElementById('open-filter').addEventListener('click', () => {
    openFilterModal(activeFilterIds, refreshStockFilter);
  });

  document.getElementById('open-sale-filter').addEventListener('click', () => {
    openFilterModal(saleFilterIds, refreshSaleFilter);
  });

  document.getElementById('close-filter-modal').addEventListener('click', closeFilterModal);
  document.getElementById('filter-modal').addEventListener('click', (e) => {
    if (e.target.id === 'filter-modal') closeFilterModal();
  });

  // ---------- Sort ----------
  const SORT_OPTIONS = [
    { key: 'name-asc',     label: 'Name (A-Z)' },
    { key: 'name-desc',    label: 'Name (Z-A)' },
    { key: 'stock-asc',    label: 'Stock (Low to High)' },
    { key: 'stock-desc',   label: 'Stock (High to Low)' },
    { key: 'price-asc',    label: 'Price (Low to High)' },
    { key: 'price-desc',   label: 'Price (High to Low)' },
    { key: 'status-desc',  label: 'Status (Out of stock first)' },
    { key: 'status-asc',   label: 'Status (Available first)' },
    { key: 'updated-desc', label: 'Last updated (Newest first)' },
    { key: 'updated-asc',  label: 'Last updated (Oldest first)' },
  ];
  let stockSort = 'updated-desc';
  let saleSort = 'updated-desc';
  let currentSortContext = null;

  function statusRank(item) {
    if (item.stock <= 0) return 2;
    if (item.stock <= (item.lowAt || 0)) return 1;
    return 0;
  }

  function sortItems(items, sortKey) {
    const [field, dir] = sortKey.split('-');
    const sign = dir === 'asc' ? 1 : -1;
    const sorted = items.slice();
    sorted.sort((a, b) => {
      let primary = 0;
      if (field === 'name')   primary = a.name.localeCompare(b.name) * sign;
      else if (field === 'stock')   primary = (a.stock - b.stock) * sign;
      else if (field === 'price')   primary = (a.price - b.price) * sign;
      else if (field === 'status')  primary = (statusRank(a) - statusRank(b)) * sign;
      else if (field === 'updated') primary = ((a.updatedAt || 0) - (b.updatedAt || 0)) * sign;
      if (primary !== 0) return primary;
      return a.name.localeCompare(b.name);
    });
    return sorted;
  }

  function renderSortModalBody() {
    if (!currentSortContext) return;
    const { getSort, setSort, refresh } = currentSortContext;
    const bodyEl = document.getElementById('sort-modal-body');
    const currentSort = getSort();
    let html = '';
    SORT_OPTIONS.forEach(opt => {
      const isActive = opt.key === currentSort;
      html += `<button type="button" class="sort-option ${isActive ? 'active' : ''}" data-sort="${opt.key}">${opt.label}</button>`;
    });
    bodyEl.innerHTML = html;
    bodyEl.querySelectorAll('[data-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        setSort(btn.dataset.sort);
        refresh();
        renderSortModalBody();
      });
    });
  }

  function openSortModal(getSort, setSort, refresh) {
    currentSortContext = { getSort, setSort, refresh };
    document.getElementById('sort-modal').classList.add('active');
    document.body.classList.add('modal-open');
    renderSortModalBody();
  }

  function closeSortModal() {
    document.getElementById('sort-modal').classList.remove('active');
    currentSortContext = null;
    const itemModalOpen = document.getElementById('item-modal').classList.contains('active');
    const tagsModalOpen = document.getElementById('tags-modal').classList.contains('active');
    const filterModalOpen = document.getElementById('filter-modal').classList.contains('active');
    if (!itemModalOpen && !tagsModalOpen && !filterModalOpen) {
      document.body.classList.remove('modal-open');
    }
  }

  document.getElementById('open-sort').addEventListener('click', () => {
    openSortModal(
      () => stockSort,
      (newSort) => { stockSort = newSort; },
      () => renderInventory()
    );
  });

  document.getElementById('open-sale-sort').addEventListener('click', () => {
    openSortModal(
      () => saleSort,
      (newSort) => { saleSort = newSort; },
      () => renderSalePicker()
    );
  });

  document.getElementById('close-sort-modal').addEventListener('click', closeSortModal);
  document.getElementById('sort-modal').addEventListener('click', (e) => {
    if (e.target.id === 'sort-modal') closeSortModal();
  });

  // ---------- Inline row menu ----------
  function closeAllRowMenus() {
    document.querySelectorAll('.row-menu.open').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.item.menu-open').forEach(i => i.classList.remove('menu-open'));
  }

  function toggleRowMenu(itemId) {
    const menu = document.getElementById('menu-' + itemId);
    if (!menu) return;
    const wasOpen = menu.classList.contains('open');
    closeAllRowMenus();
    if (!wasOpen) {
      menu.classList.add('open');
      const itemEl = menu.closest('.item');
      if (itemEl) itemEl.classList.add('menu-open');
    }
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.item-actions')) closeAllRowMenus();
  });

  function renderColorSwatches() {
    const el = document.getElementById('color-swatches');
    el.innerHTML = TAG_COLORS.map(c =>
      `<button type="button" class="color-swatch ${c === selectedTagColor ? 'selected' : ''}" style="background:${c};" data-color="${c}" aria-label="Color ${c}"></button>`
    ).join('');
    el.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedTagColor = btn.dataset.color;
        renderColorSwatches();
      });
    });
  }

  function renderItemTags(item) {
    const tags = (item.tagIds || [])
      .map(id => state.tags.find(t => t.id === id))
      .filter(Boolean);
    if (!tags.length) return '';
    return '<div class="item-tags">' +
      tags.map(t => `<span class="tag-chip" style="background:${t.color};">${escapeHtml(t.name)}</span>`).join('') +
      '</div>';
  }

  function renderTagsList() {
    const el = document.getElementById('tags-list-area');
    if (!state.tags.length) {
      el.innerHTML = '<div class="empty">No tags yet. Add one above.</div>';
      return;
    }
    const groups = { series: [], itemType: [] };
    state.tags.forEach(t => { if (groups[t.type]) groups[t.type].push(t); });
    let html = '';
    ['series', 'itemType'].forEach(type => {
      if (!groups[type].length) return;
      html += `<div class="tag-type-header">${TAG_TYPE_LABELS[type]}</div><div>`;
      groups[type].forEach(t => {
        html += `<span class="tag-chip" style="background:${t.color};">${escapeHtml(t.name)}<span class="x" data-del-tag="${t.id}">×</span></span>`;
      });
      html += '</div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('[data-del-tag]').forEach(x => {
      x.addEventListener('click', () => {
        const id = x.dataset.delTag;
        const tag = state.tags.find(t => t.id === id);
        if (!tag) return;
        const usedBy = state.items.filter(i => (i.tagIds || []).includes(id)).length;
        const msg = usedBy
          ? `Delete "${tag.name}"? It is used by ${usedBy} item(s) and will be removed from them.`
          : `Delete "${tag.name}"?`;
        if (!confirm(msg)) return;
        state.tags = state.tags.filter(t => t.id !== id);
        state.items.forEach(i => {
          if (i.tagIds) i.tagIds = i.tagIds.filter(tid => tid !== id);
        });
        pendingTagIds.delete(id);
        activeFilterIds.delete(id);
        saleFilterIds.delete(id);
        save();
        renderTagsList();
        renderTagPicker();
        renderFilterChipsStock();
        renderFilterChipsSale();
        if (currentFilterContext) renderFilterModalBody();
        renderInventory();
        renderSalePicker();
      });
    });
  }

  function renderTagPicker() {
    const el = document.getElementById('item-tag-picker');
    if (!el) return;
    if (!state.tags.length) {
      el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:4px 0 8px;">No tags yet. Tap "Manage tags" to create some.</div>';
      return;
    }
    const groups = { series: [], itemType: [] };
    state.tags.forEach(t => { if (groups[t.type]) groups[t.type].push(t); });
    let html = '';
    ['series', 'itemType'].forEach(type => {
      if (!groups[type].length) return;
      html += `<div class="tag-type-header">${TAG_TYPE_LABELS[type]}</div><div style="margin-bottom:6px;">`;
      groups[type].forEach(t => {
        const selected = pendingTagIds.has(t.id);
        const style = selected
          ? `background:${t.color};color:white;`
          : `color:${t.color};border-color:${t.color};`;
        html += `<button type="button" class="tag-chip ${selected ? '' : 'outline'}" data-toggle-tag="${t.id}" style="${style}">${escapeHtml(t.name)}</button>`;
      });
      html += '</div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('[data-toggle-tag]').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.toggleTag;
        if (pendingTagIds.has(id)) {
          pendingTagIds.delete(id);
        } else {
          const clickedTag = state.tags.find(t => t.id === id);
          if (clickedTag) {
            state.tags
              .filter(t => t.type === clickedTag.type)
              .forEach(t => pendingTagIds.delete(t.id));
          }
          pendingTagIds.add(id);
        }
        renderTagPicker();
      });
    });
  }

  function openTagsModal() {
    document.getElementById('tags-modal').classList.add('active');
    document.body.classList.add('modal-open');
    document.getElementById('t-name').value = '';
    renderColorSwatches();
    renderTagsList();
  }
  function closeTagsModal() {
    document.getElementById('tags-modal').classList.remove('active');
    if (!document.getElementById('item-modal').classList.contains('active')) {
      document.body.classList.remove('modal-open');
    }
    renderTagPicker();
    renderFilterChipsStock();
    renderFilterChipsSale();
    if (currentFilterContext) renderFilterModalBody();
    renderInventory();
    renderSalePicker();
  }

  document.getElementById('open-manage-tags').addEventListener('click', openTagsModal);
  document.getElementById('open-tags-from-item').addEventListener('click', openTagsModal);
  document.getElementById('close-tags-modal').addEventListener('click', closeTagsModal);
  document.getElementById('tags-modal').addEventListener('click', (e) => {
    if (e.target.id === 'tags-modal') closeTagsModal();
  });

  document.getElementById('tag-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const type = document.getElementById('t-type').value;
    const name = document.getElementById('t-name').value.trim();
    if (!name) return;
    if (state.tags.some(t => t.type === type && t.name.toLowerCase() === name.toLowerCase())) {
      toast('A tag with that name already exists in this type');
      return;
    }
    state.tags.push({ id: uid(), type, name, color: selectedTagColor });
    save();
    document.getElementById('t-name').value = '';
    renderTagsList();
    renderFilterChipsStock();
    renderFilterChipsSale();
    if (currentFilterContext) renderFilterModalBody();
    toast('Tag added');
  });

  // ---------- Init ----------
  renderInventory();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
